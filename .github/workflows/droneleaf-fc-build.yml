# DroneLeaf flight-controller firmware: the .hex of one commit, built with a
# plain `make <BOARD>_rev FORKNAME=droneleaf`, as software-stack's
# betaflight_build.yml does. Settings are not part of the build: after
# flashing, apply the airframe's baseline from leaf-racer-db-migration
# (betaflight/<size>.txt), which pins what a plain build does not default
# (the MicoAir743 V2's GPS port).
#
# - A release is published: builds the tagged commit and attaches the hex to
#   the release.
# - Run workflow (Actions tab): builds the branch picked in "Use workflow
#   from", or the "commit" input when given (a SHA, short or full, a branch or
#   a tag), and keeps the hex as a downloadable artifact (GitHub zips it).
#   GitHub offers Run workflow only once this file is on the default branch.
#
# The hex is named droneleaf_<version>_<MCU>_<BOARD>_<commit>.hex, the commit
# being the one `version` on the FC then shows.
name: DroneLeaf FC build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit to build: SHA, branch or tag (empty = the branch selected above)'
        required: false
        default: ''
      board:
        description: 'Board, as named in src/config/configs'
        required: false
        default: MICOAIR743V2

permissions:
  contents: write   # attach the hex to the release

jobs:
  build:
    name: Build ${{ inputs.board || 'MICOAIR743V2' }}
    runs-on: ubuntu-latest
    env:
      BOARD: ${{ inputs.board || 'MICOAIR743V2' }}
      COMMIT: ${{ inputs.commit || github.sha }}

    steps:
      # The whole history, without file contents until checkout, so that any
      # commit (a short SHA too) can be selected below.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Select the commit to build
        run: |
          sha=$(git rev-parse --verify -q "$COMMIT^{commit}" \
                || git rev-parse --verify -q "origin/$COMMIT^{commit}") \
            || { echo "::error::'$COMMIT' is not a commit, branch or tag of this repository"; exit 1; }
          git checkout -q --detach "$sha"
          git log -1 --format='Building %H: %s'

      - name: Prepare board definitions
        run: |
          make configs
          if [ ! -f "src/config/configs/$BOARD/config.h" ]; then
            echo "::error::unknown board '$BOARD' (not in src/config/configs)"
            exit 1
          fi

      - name: Cache the ARM toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: tools
          key: ${{ runner.os }}-arm-sdk-${{ hashFiles('mk/tools.mk') }}

      - name: Install the ARM toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: make arm_sdk_install

      - name: Build
        run: make "${BOARD}_rev" FORKNAME=droneleaf

      - name: Find the hex
        id: hex
        run: |
          shopt -s nullglob
          hexes=(obj/droneleaf_*_"$BOARD"_*.hex)
          if [ ${#hexes[@]} -ne 1 ]; then
            echo "::error::expected one hex for $BOARD, found ${#hexes[@]}: ${hexes[*]}"
            exit 1
          fi
          echo "path=${hexes[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${hexes[0]}" .hex)" >> "$GITHUB_OUTPUT"
          {
            echo "### $(basename "${hexes[0]}")"
            echo "Commit \`$(git rev-parse HEAD)\`, board \`$BOARD\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the hex
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.hex.outputs.name }}
          path: ${{ steps.hex.outputs.path }}
          if-no-files-found: error

      - name: Attach the hex to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          HEX: ${{ steps.hex.outputs.path }}
        run: gh release upload "$GITHUB_REF_NAME" "$HEX" --clobber -R "$GITHUB_REPOSITORY"
